[package]
name = "workspace-actions-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The C interface of workspace-actions, for Swift on iOS and macOS, GTK, Android and Windows"
publish = false

[lib]
# A static library to link into an app, a shared one to load, and a Rust
# library so one native library can hold this beside the .table core.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
workspace-actions = { path = "../actions" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
