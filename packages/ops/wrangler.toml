# The maintenance page. No account id or token lives here: the Cloudflare API
# token the page reads analytics with is a secret (CF_API_TOKEN), set on the
# worker, never in a file.
name = "operations"
main = "src/entry.ts"
compatibility_date = "2026-11-01"

# The page is a static asset (built by `npm run build`): serving it runs no
# worker and costs nothing. Only the numbers, at /api/usage, run the worker.
# Deployed without its assets, the worker hands out the same page (src/entry.ts).
[assets]
directory = "dist"
run_worker_first = ["/api/*"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
# Cloudflare Access: the team domain whose login guards this page. The one
# address let in (ALLOWED_EMAIL) and the Access application's audience tag
# (ACCESS_AUD) are set on the worker when it is deployed, not kept here.
ACCESS_TEAM_DOMAIN = "https://workspace-sh.cloudflareaccess.com"

[observability]
enabled = false

# The relay's daily totals of how meetings ended, read through its object.
[[durable_objects.bindings]]
name = "TOTALS"
class_name = "Totals"
script_name = "relay"
