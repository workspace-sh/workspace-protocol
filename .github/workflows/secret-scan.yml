# Fails any push or pull request that adds something that looks like a
# secret or personal information (API tokens, private keys, invite links,
# email addresses, home-directory paths). Rules: .gitleaks.toml.
name: secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      # The rules must catch what they claim to. Samples are put together at
      # run time, so this file holds none of them whole.
      - name: Self-test the rules
        run: |
          rand_lc() { head -c 64 /dev/urandom | od -An -tx1 | tr -dc 'a-f0-9' | head -c "$1"; }
          samples=(
            "contact a.person""@""mail-host.org"
            "workspace://v1/z6Mk""Example#invite""=$(rand_lc 40)"
            "cd /home/""someone/dev"
            "cd /Users/""Someone/dev"
            "call +34 6""12 345 678"
            "https://claude.ai/code/""session_$(rand_lc 24)"
            "CLOUDFLARE_API_TOKEN""=$(rand_lc 40)"
          )
          for s in "${samples[@]}"; do
            if printf '%s\n' "$s" | ./gitleaks stdin --config .gitleaks.toml --no-banner --log-level error --exit-code 1 >/dev/null; then
              echo "::error::the rules missed a sample: ${s:0:16}..."; exit 1
            fi
          done
          for s in "noreply""@""example.com" "git""@""github.com" "/home/""user/project"; do
            printf '%s\n' "$s" | ./gitleaks stdin --config .gitleaks.toml --no-banner --log-level error --exit-code 1 >/dev/null \
              || { echo "::error::a false positive: $s"; exit 1; }
          done
          echo "rules caught every sample and passed every allowed value"
      # Scans the commits this push or pull request adds, so history that was
      # public before the scanner existed does not block new work.
      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="origin/${{ github.event.repository.default_branch }}..HEAD"
          else
            RANGE="$BASE..HEAD"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$RANGE" .
          # Commit messages are not part of the diff, so they are scanned on their own.
          git log --format='%H%n%B' "$RANGE" | ./gitleaks stdin --config .gitleaks.toml --redact --no-banner --exit-code 1
